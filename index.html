<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己対話メモ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    header {
      background-color: #f8f9fa;
      color: #212529;
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .config-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    header input, header select, header button {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      font-size: 12px;
      outline: none;
      background-color: #ffffff;
      color: #333333;
    }

    header select:focus, header input:focus {
      border-color: #86b7fe;
    }

    header input[type="password"], header input[type="text"] { flex: 1; }

    .reset-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .reset-btn:hover {
      opacity: 0.9;
    }

    /* チャット表示エリア */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background-color: #ffffff;
    }

    /* メッセージグループ（送信者＋吹き出し＋時刻） */
    .message-group {
      display: flex;
      gap: 10px;
      max-width: 85%;
    }

    .message-group.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-group.ai {
      align-self: flex-start;
    }

    .message-group.system {
      align-self: center;
      max-width: 100%;
    }

    /* アイコン */
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #f1f3f5;
      border: 1px solid #e9ecef;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sender-name {
      font-size: 11px;
      color: #6c757d;
      margin-left: 2px;
      font-weight: 500;
    }

    .bubble-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .user .bubble-wrapper {
      align-items: flex-end;
    }

    .ai .bubble-wrapper {
      align-items: flex-start;
    }

    /* メッセージカードスタイル */
    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    /* 添付画像に基づく配色設定 */
    .user .bubble {
      background-color: #e8ecf8; /* 薄いラベンダーブルー */
      color: #1a1a1a;
      border-top-right-radius: 4px;
    }

    .ai .bubble {
      background-color: #f2f2f2; /* ごく薄いグレー */
      color: #1a1a1a;
      border-top-left-radius: 4px;
    }

    .system-bubble {
      background-color: #f8f9fa;
      color: #6c757d;
      border: 1px solid #e9ecef;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      text-align: center;
    }

    /* 送信時刻・ステータス表示 */
    .time-status {
      font-size: 10px;
      color: #8e8e93;
      white-space: nowrap;
      line-height: 1;
      margin: 0 2px;
    }

    /* クイック応答（スタンプ風）バー */
    .quick-bar {
      background-color: #ffffff;
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      border-top: 1px solid #f1f3f5;
    }

    .quick-btn {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 18px;
      padding: 6px 14px;
      font-size: 12px;
      color: #495057;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .quick-btn:hover {
      background-color: #e9ecef;
      color: #212529;
    }

    /* 下部固定入力エリア */
    footer {
      background-color: #ffffff;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-top: 1px solid #e9ecef;
    }

    footer textarea {
      flex: 1;
      border: 1px solid #ced4da;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      resize: none;
      height: 42px;
      outline: none;
      font-family: inherit;
      background-color: #ffffff;
      color: #333333;
      transition: border-color 0.2s;
    }

    footer textarea:focus {
      border-color: #a5b4fc;
    }

    footer button {
      background-color: #6366f1;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    footer button:hover {
      background-color: #4f46e5;
    }

    footer button:active {
      transform: scale(0.95);
    }

    footer button:disabled {
      background-color: #e9ecef;
      color: #adb5bd;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <div class="config-row">
      <strong>自己対話メモ</strong>
      <select id="persona-select">
        <!-- 既存の3人 -->
        <option value="coach">傾聴コーチ（優しく深掘り）</option>
        <option value="devil">悪魔の代弁者（盲点を突く）</option>
        <option value="socrates">ソクラテス（質問のみ）</option>
        <!-- 新規追加の4人 -->
        <option value="dialectic" selected>統合イノベーター（弁証法・止揚）</option>
        <option value="lateral">水平ひらめき屋（前提打破・ジャンプ）</option>
        <option value="abduction">仮説デザイナー（大胆な仮説形成）</option>
        <option value="rhizome">リゾーム探索者（縦横無尽に増殖）</option>
      </select>
      <button class="reset-btn" id="reset-btn" title="会話履歴をリセット">リセット</button>
    </div>
    <div class="config-row">
      <!-- AIモデル選択プルダウン -->
      <select id="model-select">
        <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
        <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
        <option value="gemini-flash-lite-latest">Gemini FLASH-LITE</option> 
        <option value="custom">-- 自分でモデル名を入力 --</option>
      </select>
      <!-- カスタムモデル名入力フィールド（カスタム選択時のみ表示） -->
      <input type="text" id="custom-model-input" placeholder="例: gemini-3.0-flash など" style="display: none;">
      <!-- APIキー入力 -->
      <input type="password" id="api-key-input" placeholder="Gemini APIキーを入力">
    </div>
  </header>

  <div id="chat-container"></div>

  <!-- クイック応答（スタンプ風）バー -->
  <div class="quick-bar">
    <button class="quick-btn" onclick="sendQuickText('まとめる')">📝 まとめて</button>
    <button class="quick-btn" onclick="sendQuickText('別の視点は？')">💡 別の視点は？</button>
    <button class="quick-btn" onclick="sendQuickText('具体例を教えて')">🔍 具体例は？</button>
    <button class="quick-btn" onclick="sendQuickText('励まして！')">✨ 励まして</button>
    <button class="quick-btn" onclick="sendQuickText('次に何をすべき？')">🚀 次のアクションは？</button>
  </div>

  <footer>
    <textarea id="message-input" placeholder="思考を吐き出す..." rows="1"></textarea>
    <button id="send-btn">➤</button>
  </footer>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwF6AXUo4P5MFZIUibrQhXtEzSjKyLnkZCicRK1fdPf3PDf6TUHnMvVtlU-ZA9vLebh/exec";
    const MAX_TURNS_BEFORE_SUMMARY = 30; // 30往復で自動要約

    const PERSONA_CONFIG = {
      // --- 既存の3人 ---
      coach: {
        name: "傾聴コーチ",
        icon: "🌱",
        prompt: `あなたはユーザーの「思考整理パートナー（共感型コーチ）」です。
ルール：
・短文（100〜150文字程度）で返答すること。
・説教や長文のアドバイスは絶対禁止。
・ユーザーの気持ちを肯定的に受け止めた上で、思考を深める「問いかけ」を1つだけ投げかけること。`
      },
      devil: {
        name: "悪魔の代弁者",
        icon: "😈",
        prompt: `あなたは「悪魔の代弁者（クリティカルシンカー）」です。
ルール：
・短文（100〜150文字程度）で返答すること。
・ユーザーのアイデアや意見の「盲点」や「リスク」を優しく指摘すること。
・否定するのではなく "もし〜という事態が起きたらどう対応する？" といった視点を提供すること。`
      },
      socrates: {
        name: "ソクラテス",
        icon: "🏛️",
        prompt: `あなたは「ソクラテス（質問者）」です。
ルール：
・メッセージは完全な質問形式のみで返すこと（100文字以内）。
・自分の意見やアドバイスは一切言わない。
・"なぜそう思うのか？" "それによって本当はどうなりたいのか？" と質疑応答だけで思考を導くこと。`
      },

      // --- 新規追加の4人 ---
      dialectic: {
        name: "統合イノベーター",
        icon: "⚖️",
        prompt: `あなたは「ヘーゲル的弁証法を実践する思考パートナー（止揚・アウフヘーベン）」です。
ルール：
・短文（100〜150文字程度）で返答すること。
・対立する2つの意見やトレードオフ（AかBか）の悩みに対して、どちらかを否定するのではなく両者の強みを残した「第3のアイデア（C案）」を提案すること。
・「AとBを両立させるために、こんな次元で統合してみたらどうでしょうか？」とアイデアを一段上へ引き上げる問いを投げかけること。`
      },
      lateral: {
        name: "水平ひらめき屋",
        icon: "💡",
        prompt: `あなたは「ラテラルシンキング（水平思考）のパートナー」です。
ルール：
・短文（100〜150文字程度）で返答すること。
・前提や常識（「そもそもなぜそれが必要なのか？」）を崩し、まったく関係のない異分野の概念や「もし〜だったら？」という仮定を掛け合わせること。
・「もし〇〇が完全に存在しない世界だったら？」「一見関係ない△△と組み合わせたらどうなる？」など、思考のジャンプ・跳躍を促す問いを出すこと。`
      },
      abduction: {
        name: "仮説デザイナー",
        icon: "🧩",
        prompt: `あなたは「アブダクション（仮説形成）のパートナー」です。
ルール：
・短文（100〜150文字程度）で返答すること。
・ユーザーの小さな違和感や直感（奇妙な事実）に着目し、「もし〇〇という仮説（未来の前提）が正しいとすれば、今の事象はすべて説明がつくのでは？」と逆算的なアイデアを創出すること。
・データや論理の積み上げではなく、「もし未来が〇〇だとしたら？」という大胆な仮説を一緒に組み立てる問いを投げること。`
      },
      rhizome: {
        name: "リゾーム探索者",
        icon: "🌿",
        prompt: `あなたは「ドゥルーズ的リゾーム思考（縦横無尽の生成論）のパートナー」です。
ルール：
・短文（100〜150文字程度）で返答すること。
・1つの結論や本質に絞り込むのではなく、雑草の地下茎のように話題・アイデアを縦横無尽に四方八方へと広げること。
・「それって実は〇〇という分野とも繋がっているし、△△とも言えますね！さらに言えば…」と予想外の連結を提示し、思考のネットワークを増殖させる問いを投げること。`
      }
    };

    const chatContainer = document.getElementById("chat-container");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const apiKeyInput = document.getElementById("api-key-input");
    const modelSelect = document.getElementById("model-select");
    const customModelInput = document.getElementById("custom-model-input");
    const personaSelect = document.getElementById("persona-select");
    const resetBtn = document.getElementById("reset-btn");

    let conversationHistory = [];

    // 設定値のローカル保存・復元
    apiKeyInput.value = localStorage.getItem("gemini_api_key") || "";
    apiKeyInput.addEventListener("input", () => {
      localStorage.setItem("gemini_api_key", apiKeyInput.value.trim());
    });

    const savedModel = localStorage.getItem("gemini_selected_model") || "gemini-3.5-flash";
    const savedCustomModel = localStorage.getItem("gemini_custom_model") || "";

    if (modelSelect.querySelector(`option[value="${savedModel}"]`)) {
      modelSelect.value = savedModel;
      customModelInput.style.display = "none";
    } else {
      modelSelect.value = "custom";
      customModelInput.value = savedModel;
      customModelInput.style.display = "block";
    }

    customModelInput.value = savedCustomModel;

    // モデル選択時の切り替え処理
    function updateModelInputVisibility() {
      if (modelSelect.value === "custom") {
        customModelInput.style.display = "block";
        localStorage.setItem("gemini_selected_model", "custom");
      } else {
        customModelInput.style.display = "none";
        localStorage.setItem("gemini_selected_model", modelSelect.value);
      }
    }

    modelSelect.addEventListener("change", updateModelInputVisibility);
    customModelInput.addEventListener("input", () => {
      localStorage.setItem("gemini_custom_model", customModelInput.value.trim());
    });

    // 実際に使用するモデル名を取得するヘルパー関数
    function getActiveModelName() {
      if (modelSelect.value === "custom") {
        return customModelInput.value.trim() || "gemini-3.5-flash"; // 未入力時のフォールバック
      }
      return modelSelect.value;
    }

    function getCurrentTime() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      return `${month}/${date} ${hours}:${minutes}`;
    }

    function appendMessage(sender, text) {
      const selectedPersona = personaSelect.value;
      const persona = PERSONA_CONFIG[selectedPersona];
      const timeStr = getCurrentTime();

      const groupDiv = document.createElement("div");
      groupDiv.classList.add("message-group", sender === "ユーザー" ? "user" : sender === "システム" ? "system" : "ai");

      if (sender === "システム") {
        const bubbleDiv = document.createElement("div");
        bubbleDiv.classList.add("system-bubble");
        bubbleDiv.innerText = text;
        groupDiv.appendChild(bubbleDiv);
        chatContainer.appendChild(groupDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return bubbleDiv;
      }

      if (sender !== "ユーザー") {
        const avatarDiv = document.createElement("div");
        avatarDiv.classList.add("avatar");
        avatarDiv.innerText = persona.icon;
        groupDiv.appendChild(avatarDiv);
      }

      const contentDiv = document.createElement("div");
      contentDiv.classList.add("message-content");

      if (sender !== "ユーザー") {
        const nameDiv = document.createElement("div");
        nameDiv.classList.add("sender-name");
        nameDiv.innerText = persona.name;
        contentDiv.appendChild(nameDiv);
      }

      const wrapperDiv = document.createElement("div");
      wrapperDiv.classList.add("bubble-wrapper");

      const bubbleDiv = document.createElement("div");
      bubbleDiv.classList.add("bubble");
      bubbleDiv.innerText = text;

      const timeDiv = document.createElement("div");
      timeDiv.classList.add("time-status");
      timeDiv.innerText = timeStr; // 既読表記を取り払いシンプルに日付＋時刻を表示

      wrapperDiv.appendChild(bubbleDiv);
      wrapperDiv.appendChild(timeDiv);
      contentDiv.appendChild(wrapperDiv);
      groupDiv.appendChild(contentDiv);

      chatContainer.appendChild(groupDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return bubbleDiv;
    }

    async function saveToGoogleDoc(sender, text) {
      if (!GAS_URL || GAS_URL.includes("YOUR_GAS_WEB_APP_URL_HERE")) return;
      try {
        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sender: sender, message: text })
        });
      } catch (err) {
        console.error("GAS送信エラー:", err);
      }
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // 自動要約チェック＆処理関数
    async function summarizeHistoryIfNeeded() {
      const turnCount = conversationHistory.filter(h => h.role === "user").length;

      if (turnCount >= MAX_TURNS_BEFORE_SUMMARY) {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) return;

        appendMessage("システム", "📝 30往復に達したため、これまでの会話内容を自動要約して整理中...");

        const activeModel = getActiveModelName();
        const summaryEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${apiKey}`;
        
        const summaryRequestBody = {
          system_instruction: { 
            parts: [{ text: "あなたは優秀な編集者です。これまでの自己対話の履歴から、ユーザーの悩み・気づき・決定事項・これまでの経緯を簡潔に要約してください。" }] 
          },
          contents: [
            ...conversationHistory,
            { role: "user", parts: [{ text: "これまでの対話の経緯や重要なポイントを、今後の引き継ぎ用に箇条書きベースで簡潔に要約してください。" }] }
          ]
        };

        try {
          const res = await fetch(summaryEndpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(summaryRequestBody)
          });
          const data = await res.json();

          if (data.candidates && data.candidates[0]) {
            const summaryText = data.candidates[0].content.parts[0].text;
            
            const recentHistory = conversationHistory.slice(-4); 
            conversationHistory = [
              { role: "user", parts: [{ text: `【これまでの会話の引き継ぎ・要約】\n${summaryText}` }] },
              { role: "model", parts: [{ text: "了解しました。これまでの文脈を踏まえて対話を続けます。" }] },
              ...recentHistory
            ];

            appendMessage("システム", "✨ 自動要約が完了しました。対話を継続します。");
          }
        } catch (err) {
          console.error("自動要約エラー:", err);
        }
      }
    }

    // Gemini API 呼び出し
    async function fetchGeminiResponse(userText, statusBubble) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Gemini APIキーを入力してください。");
        return null;
      }

      await summarizeHistoryIfNeeded();

      const selectedPersona = personaSelect.value;
      const systemInstruction = PERSONA_CONFIG[selectedPersona].prompt;
      const activeModel = getActiveModelName();

      const currentHistory = [...conversationHistory, { role: "user", parts: [{ text: userText }] }];
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${apiKey}`;

      const requestBody = {
        system_instruction: { parts: [{ text: systemInstruction }] },
        contents: currentHistory
      };

      const maxRetries = 5;
      let delay = 2000;

      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
          });

          const data = await response.json();

          if (data.error) {
            const errorMsg = data.error.message || "";
            const isHighDemand = errorMsg.includes("high demand");
            const isQuotaExceeded = errorMsg.includes("Quota exceeded") || errorMsg.includes("limit: 20") || data.error.code === 429;

            if (isQuotaExceeded && attempt < maxRetries) {
              if (statusBubble) {
                statusBubble.innerText = `⌛ 無料枠制限のため20秒待機して再試行中... (${attempt}/${maxRetries}回目)`;
              }
              await sleep(20000);
              continue;
            }

            if (isHighDemand && attempt < maxRetries) {
              if (statusBubble) {
                statusBubble.innerText = `⏳ 回線混雑のため自動再接続中... (${attempt}/${maxRetries}回目)`;
              }
              await sleep(delay);
              delay *= 2; 
              continue;
            }

            console.error("Gemini API Error:", data.error);
            return `（エラー: ${data.error.message || "リクエストエラー"}）`;
          }

          const aiText = data.candidates[0].content.parts[0].text;
          
          conversationHistory.push({ role: "user", parts: [{ text: userText }] });
          conversationHistory.push({ role: "model", parts: [{ text: aiText }] });
          
          return aiText;
        } catch (err) {
          if (attempt < maxRetries) {
            if (statusBubble) {
              statusBubble.innerText = `⏳ 通信再試行中... (${attempt}/${maxRetries}回目)`;
            }
            await sleep(delay);
            delay *= 2;
            continue;
          }
          console.error("通信エラー:", err);
          return "（通信エラーが発生しました）";
        }
      }
    }

    async function handleSend(textToSend) {
      const text = textToSend || messageInput.value.trim();
      if (!text) return;

      sendBtn.disabled = true;

      appendMessage("ユーザー", text);
      if (!textToSend) messageInput.value = "";
      saveToGoogleDoc("ユーザー", text);

      const statusBubble = appendMessage("AI", "💭 考え中...");

      const aiResponse = await fetchGeminiResponse(text, statusBubble);

      if (aiResponse) {
        statusBubble.innerText = aiResponse;
        saveToGoogleDoc("AI", aiResponse);
      } else {
        statusBubble.innerText = "（エラーが発生しました）";
      }

      sendBtn.disabled = false;
    }

    function sendQuickText(text) {
      handleSend(text);
    }

    resetBtn.addEventListener("click", () => {
      if (confirm("会話の文脈履歴をリセットしますか？（画面上の表示は残ります）")) {
        conversationHistory = [];
        appendMessage("AI", "🔄 会話の文脈をリセットしました。新しい話題をどうぞ！");
      }
    });

    sendBtn.addEventListener("click", () => handleSend());

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
  </script>
</body>
</html>
